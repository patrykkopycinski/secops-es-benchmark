# Public READ-ONLY demo for the benchmark dataset: Kibana + ES exposed via ingress+TLS.
# Read-only user `benchmark`/`benchmark` (role bench_ro + viewer) — cannot write/delete.
# Hostnames use the existing *.k8s.tocharian.eu wildcard (single label level).
#   Kibana : https://secops-benchmark.k8s.tocharian.eu
#   ES     : https://secops-benchmark-es.k8s.tocharian.eu
# Prereq: kibana_system password set in es-bench ES; benchmark user created (see README).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: es-bench
spec:
  replicas: 1
  selector:
    matchLabels: { app: kibana }
  template:
    metadata:
      labels: { app: kibana }
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.17.3
          env:
            - { name: ELASTICSEARCH_HOSTS, value: "http://es-bench.es-bench.svc.cluster.local:9200" }
            - { name: ELASTICSEARCH_USERNAME, value: "kibana_system" }
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef: { name: es-bench-credentials, key: KIBANA_SYSTEM_PASSWORD }
            - { name: SERVER_PUBLICBASEURL, value: "https://secops-benchmark.k8s.tocharian.eu" }
            - { name: XPACK_SECURITY_ENCRYPTIONKEY, value: "benchmark_kibana_security_key_32bytes!!" }
            - { name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY, value: "benchmark_kibana_savedobj_key_32bytes!!!" }
            - { name: XPACK_REPORTING_ENCRYPTIONKEY, value: "benchmark_kibana_reporting_key_32bytes!!" }
          ports: [ { containerPort: 5601 } ]
          resources:
            requests: { memory: "800Mi", cpu: "200m" }
            limits: { memory: "1500Mi" }
          readinessProbe:
            httpGet: { path: /api/status, port: 5601 }
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata: { name: kibana, namespace: es-bench }
spec:
  selector: { app: kibana }
  ports: [ { name: http, port: 5601, targetPort: 5601 } ]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: secops-benchmark-tls, namespace: es-bench }
spec:
  secretName: secops-benchmark-tls
  issuerRef: { name: letsencrypt-prod, kind: ClusterIssuer }
  dnsNames:
    - secops-benchmark.k8s.tocharian.eu
    - secops-benchmark-es.k8s.tocharian.eu
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: es-bench
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ secops-benchmark.k8s.tocharian.eu ]
      secretName: secops-benchmark-tls
  rules:
    - host: secops-benchmark.k8s.tocharian.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: kibana, port: { number: 5601 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: es-ro
  namespace: es-bench
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ secops-benchmark-es.k8s.tocharian.eu ]
      secretName: secops-benchmark-tls
  rules:
    - host: secops-benchmark-es.k8s.tocharian.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: es-bench, port: { number: 9200 } } }
