apiVersion: v1
kind: Namespace
metadata:
  name: es-bench
---
# NOTE: the Secret `es-bench-credentials` is NOT committed. Create it from your own
# passwords before applying this manifest — see lab/.env.example and lab/deploy.sh:
#   kubectl -n es-bench create secret generic es-bench-credentials \
#     --from-literal=ELASTIC_PASSWORD="$ELASTIC_PASSWORD" \
#     --from-literal=KIBANA_SYSTEM_PASSWORD="$KIBANA_SYSTEM_PASSWORD" \
#     --from-literal=BENCHMARK_RO_PASSWORD="$BENCHMARK_RO_PASSWORD"
# The manifests below read these via secretKeyRef; nothing hardcodes a password.
---
apiVersion: v1
kind: Service
metadata:
  name: es-bench
  namespace: es-bench
spec:
  selector:
    app: es-bench
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: es-bench
  namespace: es-bench
spec:
  serviceName: es-bench
  replicas: 1
  selector:
    matchLabels:
      app: es-bench
  template:
    metadata:
      labels:
        app: es-bench
    spec:
      initContainers:
        - name: sysctl
          image: busybox
          securityContext:
            privileged: true
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
          env:
            - name: discovery.type
              value: single-node
            - name: ELASTIC_PASSWORD                 # bootstrap password, from the Secret
              valueFrom:
                secretKeyRef:
                  name: es-bench-credentials
                  key: ELASTIC_PASSWORD
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
            - name: xpack.license.self_generated.type
              value: "basic"
            - name: ES_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          ports:
            - containerPort: 9200
              name: http
          resources:
            requests:
              memory: "1500Mi"
              cpu: "300m"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          # password-independent: TCP check, so changing ELASTIC_PASSWORD never breaks it
          readinessProbe:
            tcpSocket:
              port: 9200
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 20
      volumes:
        - name: data
          emptyDir: {}
